<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Foodie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .login-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(138, 102, 45, 0.85), rgba(249,168,37,0.85)),
        url("assets/images/flame_bg.png") center/cover no-repeat;
    }

    .login-box {
      background: #fff;
      padding: 50px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .login-box h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #333;
    }

    .login-box p {
      color: #666;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid #ddd;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: #5a31f4;
      box-shadow: 0 0 0 3px rgba(90, 49, 244, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5a31f4;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    button:hover {
      background: #4a28d6;
      transform: translateY(-2px);
    }

    .login-footer {
      margin-top: 25px;
      font-size: 14px;
    }

    .login-footer a {
      color: #5a31f4;
      text-decoration: none;
    }

    /* Decorative Images */
    .food-img-left,
    .food-img-right {
      position: absolute;
      width: 320px;
      max-width: 35vw;
    }

    .food-img-left {
      left: 40px;
      bottom: 40px;
    }

    .food-img-right {
      right: 40px;
      top: 40px;
    }

    @media(max-width: 900px) {
      .food-img-left,
      .food-img-right {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="login-hero">
    <!-- Decorative Images -->
    <img src="assets/images/FOOO-removebg-preview.png" class="food-img-left">
    <img src="assets/images/Colorful_pizza_slice_melting_cheese_tomato_olives___Premium_AI-generated_image-removebg-preview.png" class="food-img-right">

    <div class="login-box">
      <h1>Welcome Back</h1>
      <p>Sign in to continue ordering delicious food</p>
      
      <div class="input-group">
        <input type="email" placeholder="Email address" id="email">
      </div>
      
      <div class="input-group">
        <input type="password" placeholder="Password" id="password">
      </div>

      <button onclick="login()">Login</button>

      <div class="login-footer">
        <p>Don't have an account? <a href="signin.html">Sign up</a></p>
      </div>
    </div>
  </section>

  <script>
    function login() {
      // Add your actual login logic here later
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
